services:
  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: wns-qdrant
    ports:
      - "5001:6333"
      - "5002:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: wns-pgvector
    environment:
      POSTGRES_USER: wns
      POSTGRES_PASSWORD: wns_password
      POSTGRES_DB: wns_benchmark
    ports:
      - "5003:5432"
    volumes:
      - pgvector_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wns -d wns_benchmark"]
      interval: 10s
      timeout: 5s
      retries: 5

  weaviate:
    image: semitechnologies/weaviate:1.27.8
    container_name: wns-weaviate
    ports:
      - "5004:8080"
      - "5005:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      CLUSTER_HOSTNAME: node1
    volumes:
      - weaviate_storage:/var/lib/weaviate

volumes:
  qdrant_storage:
  pgvector_storage:
  weaviate_storage:
